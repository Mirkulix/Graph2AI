[package]
name = "qlang"
version = "0.1.0"
edition = "2021"
description = "QLANG - Graph-based AI-to-AI programming language"

[workspace]
members = [
    "crates/qlang-core",
    "crates/qlang-compile",
    "crates/qlang-runtime",
    "crates/qlang-agent",
    "crates/qlang-sdk",
    "qo/qo-server",
    "qo/qo-llm",
    "qo/qo-memory",
    "qo/qo-values",
    "qo/qo-agents",
    "qo/qo-telegram",
    "qo/qo-qlms-bridge",
    "qo/qo-knowledge",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "QLANG - Graph-based AI-to-AI programming language"

[workspace.dependencies]
qlang-core = { path = "crates/qlang-core" }
qlang-compile = { path = "crates/qlang-compile", default-features = false }
qlang-runtime = { path = "crates/qlang-runtime" }
qlang-agent = { path = "crates/qlang-agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
reqwest = { version = "0.12", features = ["json"] }
redb = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1.51.0", features = ["full"] }

[dependencies]
qlang-core = { workspace = true }
qlang-compile = { workspace = true }
qlang-runtime = { workspace = true }
qlang-agent = { workspace = true }
bincode = "1.3"
rayon = "1.10"
serde = { workspace = true }
serde_json = { workspace = true }
# `qlang graph` talks to a running qo over HTTP, and signs deltas locally.
reqwest = { workspace = true }
qo-knowledge = { path = "qo/qo-knowledge" }
inkwell = { version = "0.5", features = ["llvm18-0"], optional = true }
tokio = { version = "1.51.0", features = ["full"] }
qo-server = { path = "qo/qo-server" }
qo-telegram = { path = "qo/qo-telegram" }
qo-memory = { path = "qo/qo-memory" }
qo-agents = { path = "qo/qo-agents" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }

[[bin]]
name = "qo"
path = "src/main.rs"

[[bin]]
name = "qlang"
path = "src/cli.rs"

[features]
default = ["llvm"]
llvm = ["inkwell", "qlang-compile/llvm"]

[[example]]
name = "hello_qlang"
path = "examples/hello_qlang.rs"

[[example]]
name = "jit_compile"
path = "examples/jit_compile.rs"

[[example]]
name = "benchmark_suite"
path = "examples/benchmark_suite.rs"
