[package]
name = "qlang-runtime"
version.workspace = true
edition.workspace = true
description = "QLANG runtime - Graph executor and scheduler"

[features]
default = []
# Compatibility feature stubs: the repo no longer wires GPU/MLX backends,
# but some modules still use these cfg flags and should remain warning-free.
gpu = []
mlx = []
tls = ["rustls", "webpki-roots"]

[dependencies]
qlang-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = "1.10"
redb = { workspace = true }
bincode = "1.3"
tokio = { workspace = true }
rustls = { version = "0.23", optional = true }
webpki-roots = { version = "0.26", optional = true }
