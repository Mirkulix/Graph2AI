name: CI

on:
  push:
    branches:
      - NewWayLLMHandling
      - orbitqlang
      - multi-ide-mesh
      - auto-trigger
      - consensus-fanout
      - pipeline-chains
      - final-mcp-and-merge
      - production-polish
  pull_request:
    branches:
      - NewWayLLMHandling
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (no default features)
        run: cargo check --workspace --no-default-features
      - name: cargo test (qo-server only -- fast)
        run: cargo test -p qo-server --no-default-features --lib
      - name: cargo clippy (warnings allowed for now, but visible)
        run: cargo clippy --workspace --no-default-features --all-targets -- -D warnings
        continue-on-error: true

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: tsc strict check
        run: npx tsc --noEmit
      - name: vite build
        run: npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 14

  extension-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - name: tsc -p .
        run: npx tsc -p .
      - name: vsce package
        run: npx -y @vscode/vsce@latest package --allow-missing-repository --allow-star-activation
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: editors/vscode/*.vsix
          retention-days: 14

  ci-summary:
    needs: [rust-check, frontend-build, extension-package]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## CI Result" >> $GITHUB_STEP_SUMMARY
          echo "- Rust check: ${{ needs.rust-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend build: ${{ needs.frontend-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Extension package: ${{ needs.extension-package.result }}" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.rust-check.result }}" == "failure" || "${{ needs.frontend-build.result }}" == "failure" || "${{ needs.extension-package.result }}" == "failure" ]]; then
            exit 1
          fi
